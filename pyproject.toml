[build-system]
requires = ["setuptools>=71,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot"
version = "0.6.1"
description = "Official LeRobot v0.6.1 data backend for Python 3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "The Hugging Face Inc. team" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["lerobot", "huggingface", "dataset", "robotics"]
dependencies = [
    "torch>=2.7,<2.12.0",
    "torchvision>=0.22.0,<0.27.0",
    "numpy>=1.26.0,<2.3.0",
    "Pillow>=10.0.0,<13.0.0",
    "huggingface-hub>=1.5.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "packaging>=24.2,<26.0",
    "datasets>=4.0.0,<4.7.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=18.0.0,<19.0.0",
    "av>=15.0.0,<16.0.0",
    "fsspec>=2023.1.0",
    "jsonlines>=4.0.0,<5.0.0",
    "tqdm>=4.66.0,<5.0.0",
]

[project.optional-dependencies]
torchcodec = ["torchcodec>=0.3.0,<0.12.0"]
test = ["pytest>=8.1.0,<10.0.0"]

[project.urls]
homepage = "https://huggingface.co/lerobot"
documentation = "https://huggingface.co/docs/lerobot/index"
source = "https://github.com/Livfour/lerobot/tree/agent/data-only-py311-v0.6.1"
upstream = "https://github.com/huggingface/lerobot/tree/v0.6.1"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "lerobot",
    "lerobot.configs",
    "lerobot.datasets",
    "lerobot.scripts",
    "lerobot.utils",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "T20", "N", "UP", "SIM"]
ignore = [
    "E501",
    "T201",
    "T203",
    "B008",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402"]
"src/lerobot/scripts/convert_dataset_v21_to_v30.py" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["lerobot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
